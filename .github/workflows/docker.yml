name: Docker Build & Publish

# - push to main / manual run: build, test and publish.
# - weekly schedule: rebuild with a fresh MT5 download and publish only if
#   MetaQuotes has released a new terminal build since the last image.
# - pull request: build and test, never publish.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      refresh_mt5:
        description: "Download MetaTrader 5 again even if it is cached"
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The API's own tests, against a fake MetaTrader5 module (api/tests/unit/
  # fake_mt5.py). No Wine, no broker, and they gate the build.
  unit:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        working-directory: api
        run: python -m pytest tests/unit -q

  build:
    name: Build, test & publish
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Settings
        id: cfg
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/mt5api" >> "$GITHUB_OUTPUT"
          # The MT5 layer is keyed on the ISO week: builds within a week reuse
          # the cached terminal, the first build of a new week downloads it
          # again. A manual run can force it.
          if [ "${{ inputs.refresh_mt5 }}" = "true" ]; then
            echo "mt5_bust=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "mt5_bust=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The runner's disk is shared with a lot of preinstalled SDKs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mt5api:ci
          # Links the GHCR package to this repository.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: MT5_CACHE_BUST=${{ steps.cfg.outputs.mt5_bust }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: MetaTrader 5 build in the image
        id: mt5
        run: |
          version=$(docker run --rm --entrypoint cat mt5api:ci /opt/mt5-version)
          echo "MetaTrader 5 build: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          docker image ls mt5api:ci

      # The terminal starts (without an account) and the API answers /health.
      # That exercises Wine, the terminal install, the Windows Python and the
      # API's imports - everything short of a broker login.
      - name: Smoke test
        run: |
          docker run -d --name smoke --shm-size 512m -p 8000:8000 -e VNC_PASSWORD=ci mt5api:ci
          for i in $(seq 1 72); do
            if curl -fsS http://localhost:8000/health; then
              echo; echo "API is up after $((i * 5))s"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "container exited"; break
            fi
            sleep 5
          done
          docker logs smoke 2>&1 | tail -100
          exit 1

      - name: Remove smoke container
        if: always()
        run: docker rm -f smoke || true

      - name: Log in to GHCR
        if: steps.cfg.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On the weekly run, an MT5 build that is already published means there
      # is nothing new to ship.
      - name: Is this MT5 build new?
        id: check
        if: steps.cfg.outputs.publish == 'true'
        run: |
          tag="${{ steps.cfg.outputs.image }}:mt5-${{ steps.mt5.outputs.version }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.mt5.outputs.version }}" != "unknown" ] \
             && docker manifest inspect "$tag" >/dev/null 2>&1; then
            echo "$tag already published; skipping"
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.push == 'true'
        run: |
          image="${{ steps.cfg.outputs.image }}"
          for tag in latest "mt5-${{ steps.mt5.outputs.version }}" "sha-${GITHUB_SHA::7}"; do
            docker tag mt5api:ci "$image:$tag"
            docker push "$image:$tag"
          done
          echo "Published $image (MT5 ${{ steps.mt5.outputs.version }})" >> "$GITHUB_STEP_SUMMARY"
