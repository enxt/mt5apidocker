[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; X server and VNC server in one process, on display :0 and port 5900.
; -ac lets Wine connect to the display without xauth.
[program:x11]
priority=0
command=/bin/bash -c 'exec /usr/bin/Xtigervnc :0 -desktop "MetaTrader 5" -geometry "$VNC_GEOMETRY" -depth 24 -rfbport 5900 $VNC_SECURITY -ac -AlwaysShared -AcceptSetDesktopSize'
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; noVNC in the browser on port 6901: serves the viewer and proxies the
; WebSocket to the VNC server.
[program:novnc]
priority=1
command=/usr/bin/websockify --web /usr/share/novnc 6901 localhost:5900
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
priority=1
command=/usr/bin/openbox
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mt5]
priority=2
command=/usr/local/bin/run-mt5.sh
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:liveupdate]
priority=3
command=/usr/local/bin/dismiss-liveupdate.sh
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:server]
priority=3
command=/usr/local/bin/run-server.sh
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
